<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Integer Sum — Web Demo{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="/static/style.css" rel="stylesheet">
  {% block head %}{% endblock %}
</head>
<body class="shell">
<header class="site-header">
  <div class="brand">
    <img src="/static/logo.svg" alt="Logo" class="logo">
    <div class="brand-text">
      <h1>Integer Sum</h1>
      <p class="subtitle">CLI/Web same engine</p>
    </div>
  </div>
</header>

<main class="container">
  {% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>Local demo • No JavaScript</p>
</footer>
</body>
</html>
